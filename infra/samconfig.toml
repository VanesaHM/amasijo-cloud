version = 0.1

[default.global.parameters]
stack_name = "amasijo-cloud"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Para recibir alarmas por correo agrega: parameter_overrides = "AlertEmail=tu@correo.com"
